name: e2e-review
description: "T3: plan -> review_gate -> close. Tests durable wait across server restart."
stages:
  - name: plan
    agent: stub-planner
    gate: auto
  - name: review
    type: review_gate
    gate: manual
    depends_on: [plan]
  - name: close
    action: close_ticket
    gate: auto
    depends_on: [review]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # workflow_dispatch lets a maintainer fire CI manually from the Actions
  # tab (or via `gh workflow run CI`). Useful for validating long-lived
  # feature branches whose base is an integration branch rather than main
  # -- e.g. PRs into `temporal-integration` don't satisfy the branch
  # filter above and would otherwise never see this workflow.
  workflow_dispatch:

jobs:
  test:
    # Ubuntu runners are ~2-3x faster than macos-latest and don't suffer
    # the macOS-CI CPU-starvation that consistently failed our 10s
    # status-poller assertions (Gemini/Codex/Goose autonomous-flow tests
    # all timed out at exactly 10000-10300ms). The tests don't have any
    # macOS-specific dependencies -- tmux is installable on both. Darwin
    # coverage continues via build (darwin-*), install.sh matrix, and
    # desktop-e2e (macos-latest).
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Start tmux server
        run: tmux new-session -d -s ci-init

      - name: Install dependencies
        run: bun install

      - name: Build web frontend
        # packages/core/__tests__/web.test.ts serves packages/web/dist/index.html.
        # Locally `make test` depends on build-web; CI bypasses the Makefile,
        # so we must build the web dist here or the web server test flakes.
        run: cd packages/web && bunx --bun vite build --logLevel error

      - name: Lint
        run: bunx --bun eslint packages/ --max-warnings 0

      - name: Format check
        run: bunx --bun prettier --check "packages/**/*.{ts,tsx,js,jsx,json,css}"

      # Dead-code scan: knip walks the entry chain declared in knip.json
      # and flags files / exports / dependencies that nothing reaches.
      # Non-blocking for now -- the config still has a few false positives
      # around html-entry tracing and binary-only deps. The output appears
      # in the CI log; convert to a hard failure once the report is
      # consistently empty across PRs.
      - name: Dead-code scan (knip)
        continue-on-error: true
        run: bunx --bun knip --reporter compact || true

      - name: Unit tests (excludes integration)
        # Delegates to `make test`, which excludes any test file with `e2e` in
        # path plus local-arkd and local-provider tests.
        #
        # Bun exit-code quirk on macos-latest: bun occasionally exits 1
        # despite "0 fail" when a worker holds an open file descriptor at
        # process-end (tmux child, postgres connection, etc.). To avoid
        # spurious CI red, gate the step on the "X fail" line in bun's
        # summary rather than the process exit code. A real test failure
        # still appears as "1 fail" / "5 fail" in the output and fails
        # the step.
        run: |
          set +e
          make test 2>&1 | tee /tmp/bun-test.log
          BUN_EXIT=$?
          set -e
          if grep -qE '^\s*0 fail$' /tmp/bun-test.log; then
            echo "::notice::Test suite reports 0 fail (bun exited $BUN_EXIT). Treating as success."
            exit 0
          fi
          echo "::error::Test suite did not report '0 fail' (bun exit code $BUN_EXIT)."
          exit 1

  # Integration tests that need Docker (LocalStack-backed S3 round-trip).
  # macOS GitHub-hosted runners don't ship with Docker, so we run these on
  # ubuntu-latest where Docker is preinstalled. The test file skips cleanly
  # when Docker isn't available (dev laptops, non-Docker CI).
  integration-tests:
    name: integration (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verify Docker is available
        run: docker ps

      - name: Pre-pull LocalStack image
        run: docker pull localstack/localstack:3.8

      - name: LocalStack-backed S3 tests
        run: bun test packages/core/storage/__tests__/s3.test.ts --timeout 120000

  # Control-plane e2e: brings up the full hosted-mode docker stack (Postgres
  # :15434 + Redis :6380 + Temporal :7234 + temporal-worker container), spawns
  # the real `ark server start --hosted` binary, and runs every docker-stack
  # e2e file in `e2e/`:
  #   - e2e/control-plane.test.ts          (bespoke dispatch path)
  #   - e2e/temporal-control-plane.test.ts (Temporal T1-T5 routing + retries)
  #
  # The Makefile target boots the stack once and shares it across both files
  # via ARK_E2E_STACK_RUNNING=1; teardown runs on shell exit even when a test
  # fails. Worker image is built from .infra/Dockerfile.temporal-worker; GHA
  # layer cache keeps the rebuild cheap on subsequent runs (~30s warm vs
  # ~150s cold).
  e2e-control-plane:
    name: e2e (control-plane + temporal)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # DISABLED 2026-05-12: scoped down to the docker-isolation T1 + T5b path
    # while we work through the agent-cache warmup race introduced by the
    # auth-phase1 main merge. The direct-mode bespoke + Temporal coverage
    # here will resume once the DbResourceStore async-get path is fixed
    # across both dispatch entry points.
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Start tmux server
        run: tmux new-session -d -s ci-init

      - name: Install dependencies
        run: bun install

      - name: Verify Docker is available
        run: docker ps

      # Pre-pull pinned images so the compose `up --wait` doesn't pay the
      # registry-fetch cost inside the test budget. Versions mirror what
      # .infra/docker-compose.e2e.yaml references.
      - name: Pre-pull e2e stack images
        run: |
          docker pull postgres:16 &
          docker pull redis:7-alpine &
          docker pull temporalio/auto-setup:1.26 &
          docker pull temporalio/ui:2.31.2 &
          wait

      # Build temporal-worker image with GHA layer cache. Cold builds take
      # ~150s; warm builds drop to ~30s once the cache is primed. The image
      # tag must match the `image:` field on the `temporal-worker` service
      # in docker-compose.e2e.yaml so compose picks it up instead of building
      # locally during `up --wait`.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build temporal-worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .infra/Dockerfile.temporal-worker
          tags: ark-temporal-worker:e2e
          load: true
          cache-from: type=gha,scope=temporal-worker
          cache-to: type=gha,scope=temporal-worker,mode=max

      - name: Run control-plane + Temporal e2e
        run: make test-e2e-control-plane

      # Capture every container's stdout/stderr on failure so post-mortems
      # aren't blind. Logs are written by docker daemon and only survive
      # teardown if we grab them BEFORE `test-e2e-control-plane-down` drops
      # the volumes.
      - name: Dump docker compose logs (on failure)
        if: failure()
        run: |
          docker compose -f .infra/docker-compose.e2e.yaml -p ark-e2e logs --no-color > /tmp/e2e-stack.log 2>&1 || true
          ls -lh /tmp/ark-* 2>/dev/null || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-control-plane-logs
          path: |
            /tmp/e2e-stack.log
            /tmp/ark-*.log
          retention-days: 7
          if-no-files-found: ignore

      # Mirror of `dev-stack` -> `dev-stack-down`: the test target leaves the
      # stack up for iteration, so CI must tear it down explicitly. `always()`
      # ensures cleanup runs whether tests passed or failed.
      - name: Tear down e2e Docker stack
        if: always()
        run: make test-e2e-control-plane-down || true

  # T0-T5 docker-isolation e2e: same stack as e2e-control-plane plus a
  # host-side ark server + host-side temporal worker dispatching per-session
  # DockerIsolation sidecars. The Makefile target stops the compose
  # temporal-worker (host worker owns the task queue) and seeds the compute
  # row with isolation=docker + a cached sidecar image. This is the
  # production-parity shape -- same as T6's claude-agent path, just with
  # the stub-runner runtime so no real LLM is needed.
  #
  # Why a separate job from e2e-control-plane: this target exercises a
  # different dispatch path (full DockerIsolation lifecycle, sidecar arkd,
  # host.docker.internal callback) and surfaces regressions invisible to
  # the direct-isolation T1-T5. Running both gives independent coverage of
  # bespoke vs docker-isolation dispatch chains.
  e2e-temporal-docker:
    name: e2e (T0-T5 docker isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Start tmux server
        run: tmux new-session -d -s ci-init

      # tsx runs the host-side temporal worker (the Makefile target spawns
      # `tsx packages/core/temporal/worker.ts` directly). Bun-only nodes
      # don't ship tsx; install it globally so the worker entrypoint
      # resolves.
      - name: Install tsx
        run: npm install -g tsx

      - name: Install dependencies
        run: bun install

      - name: Verify Docker is available
        run: docker ps

      # Pre-pull pinned stack images so `up --wait` doesn't pay the fetch
      # cost under the test budget. Versions mirror docker-compose.e2e.yaml.
      - name: Pre-pull e2e stack images
        run: |
          docker pull postgres:16 &
          docker pull redis:7-alpine &
          docker pull temporalio/auto-setup:1.26 &
          docker pull temporalio/ui:2.31.2 &
          wait

      # Pre-pull the sidecar image -- DockerIsolation pulls on first prepare()
      # otherwise, and serial pulls inside the test budget waste seconds.
      # oven/bun:canary is the same image laptop dev uses and matches the
      # one the test seeds into compute.config.image.
      - name: Pre-pull sidecar image
        run: docker pull oven/bun:canary

      # The Makefile target's `test-e2e-control-plane-up` dependency builds
      # the temporal-worker image as a compose side effect even though this
      # target stops it before tests run. Pre-building with GHA layer cache
      # cuts the cold path to ~30s.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build temporal-worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .infra/Dockerfile.temporal-worker
          tags: ark-temporal-worker:e2e
          load: true
          cache-from: type=gha,scope=temporal-worker
          cache-to: type=gha,scope=temporal-worker,mode=max

      - name: Run T0-T5 docker-isolation e2e
        run: make test-e2e-temporal-docker

      # Capture container + host process logs on failure. ARK_HOST_ARKDIR
      # defaults to $(CURDIR)/.tmp/t6-arkdir per the Makefile -- server.log
      # and worker.log live there.
      - name: Dump docker compose logs (on failure)
        if: failure()
        run: |
          docker compose -f .infra/docker-compose.e2e.yaml -p ark-e2e logs --no-color > /tmp/e2e-stack.log 2>&1 || true
          cp -r .tmp/t6-arkdir /tmp/ark-host-logs 2>/dev/null || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-temporal-docker-logs
          path: |
            /tmp/e2e-stack.log
            /tmp/ark-host-logs/server.log
            /tmp/ark-host-logs/worker.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down e2e Docker stack
        if: always()
        run: make test-e2e-control-plane-down || true

  # Build binaries for all 4 platforms
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            name: darwin-arm64
          - target: bun-darwin-x64
            name: darwin-x64
          - target: bun-linux-arm64
            name: linux-arm64
          - target: bun-linux-x64
            name: linux-x64

    runs-on: macos-latest
    name: build (${{ matrix.name }})
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: |
          bun build --compile --target ${{ matrix.target }} \
            packages/cli/index.ts --outfile ark-${{ matrix.name }}

      - name: Verify binary exists
        run: ls -lh ark-${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ark-${{ matrix.name }}
          path: ark-${{ matrix.name }}

  # Smoke-test binaries on native platforms
  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            os: macos-latest
          - name: darwin-x64
            os: macos-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: linux-x64
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    name: smoke-test (${{ matrix.name }})
    timeout-minutes: 5

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ark-${{ matrix.name }}

      - name: Make executable
        run: chmod +x ark-${{ matrix.name }}

      - name: Test CLI (--help)
        run: ./ark-${{ matrix.name }} --help

      - name: Test CLI (--version)
        run: ./ark-${{ matrix.name }} --version

  test-install-sh:
    name: install.sh regression tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build web frontend
        run: cd packages/web && bunx --bun vite build --logLevel error
      - name: Run install tests
        run: make test-install

  web-e2e:
    runs-on: macos-latest
    timeout-minutes: 15
    continue-on-error: true # WIP: fixtures use Bun APIs incompatible with Playwright/Node runner
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install tmux
        run: brew install tmux
      - name: Start tmux server
        run: tmux new-session -d -s ci-init
      - name: Install dependencies
        run: bun install
      - name: Install Playwright browsers
        # bunx --bun: the fixture (packages/e2e/fixtures/web-server.ts)
        # uses Bun APIs (`import { spawn } from "bun"`, `import.meta.dir`,
        # `Bun.sleep`) that the Node Playwright runner can't parse. Running
        # Playwright under Bun makes the imports resolve.
        run: cd packages/e2e && bun install && bunx --bun playwright install chromium
      - name: Run Web UI E2E tests
        run: cd packages/e2e && bunx --bun playwright test

  desktop-e2e:
    name: desktop-e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # tmux is required by packages/core (session launcher imports it).
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Install tmux + Electron runtime deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux xvfb libnss3 libatk-bridge2.0-0 libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxkbcommon0 libasound2t64 || \
            sudo apt-get install -y tmux xvfb libnss3 libatk-bridge2.0-0 libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxkbcommon0 libasound2

      - name: Start tmux server
        run: tmux new-session -d -s ci-init

      - name: Install repo dependencies
        run: bun install

      # Build the React SPA the desktop shell serves. Without this,
      # the Electron window loads a 404 and every test fails.
      - name: Build web frontend
        run: bun run build:web

      - name: Install desktop dependencies
        working-directory: packages/desktop
        run: npm install

      - name: Run Electron smoke tests (macOS)
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        run: npm test

      - name: Run Electron smoke tests (Linux under xvfb)
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        run: xvfb-run -a npm test

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-${{ matrix.os }}
          path: |
            packages/desktop/test-results/
            packages/desktop/playwright-report/
          retention-days: 7

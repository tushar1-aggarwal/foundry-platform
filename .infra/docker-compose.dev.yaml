# Local Postgres + Redis + LocalStack + Temporal worker for Ark control-plane
# mode dev.
#
# Brings up:
#   - ark-postgres        : Postgres 16 on :15433, db `ark`, user/pass `ark`/`ark`.
#                           (Non-default host port so it can't clash with a host-side
#                           Postgres or an RDS SSH tunnel that already grabbed :5432.)
#   - ark-redis           : Redis 7 on :6379, no auth.
#   - ark-localstack      : LocalStack on :4566 with S3 + SSM + KMS.
#                           - S3 (bucket `ark-local`): hosted-mode boot rejects
#                             LocalDiskBlobStore as pod-ephemeral; LocalStack is
#                             the laptop stand-in for real S3 so the same code
#                             path runs locally.
#                           - SSM + KMS: SsmKekBackend and AwsSecretsProvider can
#                             run end-to-end without a real AWS account. The seed
#                             script in ./localstack-init/ populates /ark/kek/dev
#                             on first boot. Point Ark at it with
#                             ARK_KEK_SSM_ENDPOINT and ARK_SECRETS_AWS_ENDPOINT
#                             both set to http://localhost:4566.
#   - temporal-worker     : Ark Temporal worker (image ark-temporal-worker:dev).
#                           Connects to the ark-temporal compose project's server
#                           via host.docker.internal:7233 and to the ark server on
#                           the host via host.docker.internal:8421.
#
# The Temporal server itself lives in docker-compose.temporal.yaml (separate project)
# so the two stacks can be brought up independently.
#
# Usage (Makefile orchestrates both compose projects + the host server):
#   make dev-control-plane        # full laptop stack: temporal + pg/redis + worker + ark server
#   make dev-control-plane-down   # stop everything + remove volumes
#   make dev-docker               # this file's pg + redis only (no worker)
#   make dev-temporal             # the Temporal cluster (docker-compose.temporal.yaml)
#
# Wire Ark to this stack by sourcing `.env.control-plane` (or copying it
# to `.env`) before `bun packages/cli/index.ts server start --hosted`.

name: ark-dev

services:
  postgres:
    image: postgres:16
    container_name: ark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ark
      POSTGRES_PASSWORD: ark
      POSTGRES_DB: ark
    ports:
      - "15433:5432"
    volumes:
      - ark-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ark -d ark"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: ark-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ark-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  # LocalStack -- S3 (hosted-mode blob store stand-in) + SSM + KMS (so the
  # SsmKekBackend and AwsSecretsProvider can run end-to-end without a real
  # AWS account). The seed script in ./localstack-init/ populates
  # /ark/kek/dev on first boot. To use the SSM KEK backend, set:
  #   ARK_KEK_BACKEND=ssm
  #   ARK_KEK_SSM_PARAMETER=/ark/kek/dev
  #   ARK_KEK_SSM_ENDPOINT=http://localhost:4566
  #   ARK_SECRETS_BACKEND=aws
  #   ARK_SECRETS_AWS_ENDPOINT=http://localhost:4566   (gap to be closed in code)
  #   AWS_REGION=ap-south-1
  #   AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test
  localstack:
    image: localstack/localstack:3.4
    container_name: ark-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      # s3 powers the hosted-mode BlobStore stand-in; ssm + kms power the
      # SsmKekBackend / AwsSecretsProvider so the secrets stack can run
      # end-to-end against LocalStack instead of real AWS.
      SERVICES: s3,ssm,kms
      DEFAULT_REGION: ap-south-1
      DEBUG: "0"
      # Persistence on so the seeded /ark/kek/dev parameter survives
      # container restarts during dev loops.
      PERSISTENCE: "1"
      ARK_S3_BUCKET: ark-local
    volumes:
      # ready.d runs once per container start, after services report READY.
      # Idempotent S3 bucket + SSM KEK seeding lives in this directory.
      - ./localstack-init:/etc/localstack/init/ready.d:ro
      - ark-localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  temporal-worker:
    build:
      context: ..
      dockerfile: .infra/Dockerfile.temporal-worker
    image: ark-temporal-worker:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://ark:ark@postgres:5432/ark?sslmode=disable
      # Temporal server lives in the ark-temporal compose project, exposed on
      # the host at :7233. Reach it via host.docker.internal from inside this
      # container (works on Docker Desktop for Mac; host-gateway covers Linux).
      ARK_TEMPORAL_SERVER_URL: host.docker.internal:7233
      ARK_TEMPORAL_NAMESPACE: ark-dev
      ARK_TEMPORAL_WORKER: "true"
      ARK_TEMPORAL_ORCHESTRATION: "true"
      ARK_PROFILE: control-plane
      ARK_LOG_LEVEL: info
      # Hosted mode (control-plane profile) requires s3-backed blobs; LocalStack
      # is the laptop stand-in. Endpoint is the in-network DNS name, not
      # host.docker.internal -- localstack is a sibling service in this project.
      ARK_BLOB_BACKEND: s3
      ARK_S3_BUCKET: ark-local
      ARK_S3_REGION: us-east-1
      ARK_S3_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      ARK_SECRETS_BACKEND: file
      ARK_AUTH_REQUIRE_TOKEN: "false"
      ARK_DEFAULT_TENANT: default
      # Ark server runs on the host at :8421 (ARK_WEB_PORT in .env.control-plane).
      # host.docker.internal reaches it on Mac (Docker Desktop) and via
      # host-gateway on Linux.
      ARK_CONDUCTOR_URL: "http://host.docker.internal:8421"
    # Process-alive healthcheck so `docker compose up --wait` blocks until
    # the worker process is up. See docker-compose.e2e.yaml for the full
    # rationale; in dev this prevents `make dev-control-plane` from
    # reporting "ready" before the worker has registered task-queue pollers.
    # Uses /proc directly to avoid depending on procps in cached images.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "for f in /proc/[0-9]*/cmdline; do tr '\\0' ' ' < $$f 2>/dev/null | grep -q 'packages/core/temporal/worker.ts' && exit 0; done; exit 1"
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s

volumes:
  ark-postgres-data:
    name: ark-dev-postgres-data
  ark-redis-data:
    name: ark-dev-redis-data
  ark-localstack-data:
    name: ark-dev-localstack-data

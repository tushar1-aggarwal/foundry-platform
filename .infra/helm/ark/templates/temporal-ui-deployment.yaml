{{- if and .Values.temporal.enabled .Values.temporal.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ark.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ark.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: temporal-ui
  template:
    metadata:
      labels:
        {{- include "ark.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: temporal-ui
    spec:
      # K8s auto-injects TEMPORAL_SERVER_PORT=tcp://<ClusterIP>:7233 for every
      # Service in the namespace. The temporal-ui config template parses that
      # env name as an int port and crashes ("cannot unmarshal !!str `tcp://...`
      # into int"). Disabling service links removes those injections; the UI
      # only needs the explicit TEMPORAL_ADDRESS below.
      enableServiceLinks: false
      containers:
        - name: ui
          image: "{{ .Values.temporal.ui.image.repository }}:{{ .Values.temporal.ui.image.tag }}"
          env:
            - name: TEMPORAL_ADDRESS
              value: "{{ .Values.temporal.serverServiceName }}:7233"
            {{- if .Values.temporal.ui.corsOrigins }}
            - name: TEMPORAL_CORS_ORIGINS
              value: {{ .Values.temporal.ui.corsOrigins | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.temporal.ui.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
{{- end }}

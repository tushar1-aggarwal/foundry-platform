{{- if .Values.postgresql.enabled }}
{{- /*
The temporal-db-bootstrap Job creates the `temporal` role and the temporal/
temporal_visibility databases. It runs only when postgresql.enabled (the chart
owns the postgres). With an external postgres the operator must provision
these out-of-band.

This is a regular Job (NOT a helm hook) so it participates in the main install
ordering graph: postgres -> bootstrap -> schema -> temporal-server. An init
container waits for postgres TCP before the main container runs psql. The Job
name carries .Release.Revision so `helm upgrade` can create a fresh Job (Job
specs are immutable -- the previous-revision Job stays behind with its own
ttlSecondsAfterFinished).
*/ -}}
{{- $pwdKey := .Values.temporal.persistence.secretKeys.password }}
{{- $userKey := .Values.temporal.persistence.secretKeys.username }}
{{- $existing := lookup "v1" "Secret" .Values.namespace .Values.temporal.persistence.existingSecret }}
{{- $pwd := "" }}
{{- if and $existing $existing.data (hasKey $existing.data $pwdKey) }}
  {{- $pwd = index $existing.data $pwdKey | b64dec }}
{{- else }}
  {{- $pwd = randAlphaNum 32 }}
{{- end }}
{{- $masterSecret := include "ark.temporalBootstrapMasterSecret" . }}
{{- if not $existing }}
# First-install only: chart-managed temporal DB credentials. On upgrades the
# existing Secret is preserved untouched (lookup returned non-nil above), so
# the password stays stable.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.temporal.persistence.existingSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ark.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-db-credentials
type: Opaque
stringData:
  {{ $userKey }}: temporal
  {{ $pwdKey }}: {{ $pwd | quote }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-db-bootstrap-r{{ .Release.Revision | default 1 }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ark.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-db-bootstrap
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "ark.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: temporal-db-bootstrap
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.temporal.dbBootstrap.image.repository }}:{{ .Values.temporal.dbBootstrap.image.tag }}"
          env:
            - name: PGHOST
              value: {{ include "ark.postgresqlHost" . | quote }}
            - name: PGPORT
              value: {{ include "ark.postgresqlPort" . | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ $masterSecret }}
                  key: {{ .Values.temporal.dbBootstrap.masterSecretKeys.username }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; do
                echo "waiting for postgres at $PGHOST:$PGPORT..."
                sleep 2
              done
      containers:
        - name: bootstrap
          image: "{{ .Values.temporal.dbBootstrap.image.repository }}:{{ .Values.temporal.dbBootstrap.image.tag }}"
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ $masterSecret }}
                  key: {{ .Values.temporal.dbBootstrap.masterSecretKeys.username }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $masterSecret }}
                  key: {{ .Values.temporal.dbBootstrap.masterSecretKeys.password }}
            - name: PGHOST
              value: {{ include "ark.postgresqlHost" . | quote }}
            - name: PGPORT
              value: {{ include "ark.postgresqlPort" . | quote }}
            - name: TEMPORAL_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.temporal.persistence.existingSecret }}
                  key: {{ $pwdKey }}
            - name: TEMPORAL_DB
              value: {{ .Values.temporal.persistence.database | quote }}
            - name: VISIBILITY_DB
              value: {{ .Values.temporal.persistence.visibilityDatabase | quote }}
          command:
            - sh
            - -c
            - |
              set -eo pipefail
              # Create or reset password for the temporal role (idempotent).
              psql -v ON_ERROR_STOP=1 -d postgres -c "
                DO \$do\$
                BEGIN
                  IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname='temporal') THEN
                    EXECUTE 'CREATE ROLE temporal LOGIN PASSWORD ' || quote_literal('$TEMPORAL_PWD') || ' CONNECTION LIMIT 100';
                    RAISE NOTICE 'Created role temporal';
                  ELSE
                    EXECUTE 'ALTER ROLE temporal WITH PASSWORD ' || quote_literal('$TEMPORAL_PWD') || ' CONNECTION LIMIT 100';
                    RAISE NOTICE 'Reset password + connection limit for role temporal';
                  END IF;
                END
                \$do\$;
              "
              # CREATE DATABASE cannot run in a transaction; shell-level idempotency.
              if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$TEMPORAL_DB'" | grep -q 1; then
                psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE \"$TEMPORAL_DB\" OWNER temporal"
                echo "Created database $TEMPORAL_DB"
              else
                echo "Database $TEMPORAL_DB already exists"
              fi
              if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$VISIBILITY_DB'" | grep -q 1; then
                psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE \"$VISIBILITY_DB\" OWNER temporal"
                echo "Created database $VISIBILITY_DB"
              else
                echo "Database $VISIBILITY_DB already exists"
              fi
              # Grants are idempotent.
              psql -v ON_ERROR_STOP=1 -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE \"$TEMPORAL_DB\" TO temporal;"
              psql -v ON_ERROR_STOP=1 -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE \"$VISIBILITY_DB\" TO temporal;"
              echo "temporal-db-bootstrap complete"
{{- end }}

{{- /*
Temporal schema setup + migration. Always emitted -- the server cannot start
without its schema.

Regular Job (NOT a helm hook) so it participates in the main install ordering
graph: postgres -> bootstrap (if in-cluster) -> schema -> temporal-server.

Init container waits for the temporal database to exist (created by the
bootstrap Job, or pre-provisioned by the operator when postgresql.enabled=false).
The main container connects via the temporal role (its credentials live in
temporal.persistence.existingSecret).

Job name carries .Release.Revision so `helm upgrade` re-runs migrations on new
chart versions; ttlSecondsAfterFinished cleans up old revisions.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-schema-r{{ .Release.Revision | default 1 }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ark.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-schema
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "ark.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: temporal-schema
    spec:
      restartPolicy: Never
      initContainers:
        # Wait until the temporal database exists. With in-cluster postgres the
        # bootstrap Job creates it; with external postgres the operator has
        # already created it before install.
        - name: wait-for-temporal-db
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: {{ include "ark.postgresqlHost" . | quote }}
            - name: PGPORT
              value: {{ include "ark.postgresqlPort" . | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.temporal.persistence.existingSecret }}
                  key: {{ .Values.temporal.persistence.secretKeys.username }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.temporal.persistence.existingSecret }}
                  key: {{ .Values.temporal.persistence.secretKeys.password }}
            - name: TEMPORAL_DB
              value: {{ .Values.temporal.persistence.database | quote }}
            - name: VISIBILITY_DB
              value: {{ .Values.temporal.persistence.visibilityDatabase | quote }}
          command:
            - sh
            - -c
            - |
              until psql -d "$TEMPORAL_DB" -c 'SELECT 1' >/dev/null 2>&1; do
                echo "waiting for temporal database $TEMPORAL_DB..."
                sleep 2
              done
              until psql -d "$VISIBILITY_DB" -c 'SELECT 1' >/dev/null 2>&1; do
                echo "waiting for visibility database $VISIBILITY_DB..."
                sleep 2
              done
              echo "both temporal databases reachable"
      containers:
        - name: schema
          image: "{{ .Values.temporal.schemaJob.image.repository }}:{{ .Values.temporal.schemaJob.image.tag }}"
          env:
            - name: SQL_PLUGIN
              value: postgres12
            {{- if .Values.temporal.server.tls.enabled }}
            - name: SQL_TLS_ENABLED
              value: "true"
            - name: SQL_TLS_DISABLE_HOST_VERIFICATION
              value: "true"
            {{- end }}
            - name: SQL_HOST
              value: {{ include "ark.postgresqlHost" . | quote }}
            - name: SQL_PORT
              value: {{ include "ark.postgresqlPort" . | quote }}
            - name: SQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.temporal.persistence.existingSecret }}
                  key: {{ .Values.temporal.persistence.secretKeys.username }}
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.temporal.persistence.existingSecret }}
                  key: {{ .Values.temporal.persistence.secretKeys.password }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              DB={{ .Values.temporal.persistence.database }}
              VDB={{ .Values.temporal.persistence.visibilityDatabase }}
              {{ if .Values.temporal.server.tls.enabled }}# TLS: --tls --tls-disable-host-verification on every sql-tool call below.{{ end }}

              # Idempotent setup helper: succeed cleanly if the schema_version
              # table already exists; surface any other error loudly.
              run_setup() {
                local db="$1"
                local out
                if out=$(temporal-sql-tool {{ if .Values.temporal.server.tls.enabled }}--tls --tls-disable-host-verification {{ end }}--db "$db" setup-schema -v 0.0 2>&1); then
                  echo "$out"
                  return 0
                fi
                if echo "$out" | grep -qiE 'already exists|already initialized'; then
                  echo "Schema for $db already initialized, skipping setup."
                  return 0
                fi
                echo "ERROR: setup-schema failed for $db:" >&2
                echo "$out" >&2
                return 1
              }

              run_setup "$DB"
              temporal-sql-tool {{ if .Values.temporal.server.tls.enabled }}--tls --tls-disable-host-verification {{ end }}--db "$DB" update-schema --schema-dir schema/postgresql/v12/temporal/versioned
              run_setup "$VDB"
              temporal-sql-tool {{ if .Values.temporal.server.tls.enabled }}--tls --tls-disable-host-verification {{ end }}--db "$VDB" update-schema --schema-dir schema/postgresql/v12/visibility/versioned
              echo "Schema setup + update complete for $DB and $VDB."

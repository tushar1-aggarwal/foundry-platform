{{- /*
Temporal schema setup + migration. Always emitted -- the server cannot start
without its schema.

post-install,post-upgrade hook (weight 0, after temporal-db-bootstrap at -5).
The temporal databases exist by now (bootstrap created them, or the operator
pre-provisioned them for external postgres). temporal-sql-tool fails fast if
the database is briefly unreachable; the Job's backoffLimit is the k8s-native
retry. setup-schema is idempotent and update-schema is a no-op when current,
so re-runs on upgrade are safe (and required, to pick up new schema versions).
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-schema
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ark.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-schema
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/sync-wave": "0"
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: {{ .Values.temporal.schemaJob.backoffLimit }}
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "ark.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: temporal-schema
    spec:
      restartPolicy: Never
      containers:
        - name: schema
          image: "{{ .Values.temporal.schemaJob.image.repository }}:{{ .Values.temporal.schemaJob.image.tag }}"
          env:
            - name: SQL_PLUGIN
              value: postgres12
            {{- if .Values.temporal.server.tls.enabled }}
            - name: SQL_TLS_ENABLED
              value: "true"
            - name: SQL_TLS_DISABLE_HOST_VERIFICATION
              value: "true"
            {{- end }}
            - name: SQL_HOST
              value: {{ include "ark.postgresqlHost" . | quote }}
            - name: SQL_PORT
              value: {{ include "ark.postgresqlPort" . | quote }}
            - name: SQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.temporal.persistence.existingSecret }}
                  key: {{ .Values.temporal.persistence.secretKeys.username }}
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.temporal.persistence.existingSecret }}
                  key: {{ .Values.temporal.persistence.secretKeys.password }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              DB={{ .Values.temporal.persistence.database }}
              VDB={{ .Values.temporal.persistence.visibilityDatabase }}
              {{ if .Values.temporal.server.tls.enabled }}# TLS: --tls --tls-disable-host-verification on every sql-tool call below.{{ end }}

              # Idempotent setup: succeed cleanly if schema_version already
              # exists; surface any other error loudly so the Job fails for a
              # real cause (perms, connectivity, syntax) and the controller
              # retries via backoffLimit.
              run_setup() {
                db="$1"
                if out=$(temporal-sql-tool {{ if .Values.temporal.server.tls.enabled }}--tls --tls-disable-host-verification {{ end }}--db "$db" setup-schema -v 0.0 2>&1); then
                  echo "$out"; return 0
                fi
                if echo "$out" | grep -qiE 'already exists|already initialized'; then
                  echo "Schema for $db already initialized, skipping setup."; return 0
                fi
                echo "ERROR: setup-schema failed for $db:" >&2
                echo "$out" >&2
                return 1
              }

              run_setup "$DB"
              temporal-sql-tool {{ if .Values.temporal.server.tls.enabled }}--tls --tls-disable-host-verification {{ end }}--db "$DB" update-schema --schema-dir schema/postgresql/v12/temporal/versioned
              run_setup "$VDB"
              temporal-sql-tool {{ if .Values.temporal.server.tls.enabled }}--tls --tls-disable-host-verification {{ end }}--db "$VDB" update-schema --schema-dir schema/postgresql/v12/visibility/versioned
              echo "Schema setup + update complete for $DB and $VDB."

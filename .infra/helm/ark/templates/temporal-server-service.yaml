apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.temporal.serverServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ark.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-server
spec:
  type: ClusterIP
  selector:
    {{- include "ark.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-server
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
      protocol: TCP

{{- if and .Values.localstack.enabled .Values.s3.bucket }}
{{- /*
Idempotent S3 bucket creation against in-cluster LocalStack.

Regular Job (NOT a helm hook) so it participates in the main install graph and
helm --wait correctly observes its completion. Init container waits for the
LocalStack edge port; main container creates the bucket via awscli.

Job name carries .Release.Revision so `helm upgrade` re-runs (e.g. when the
bucket name changes); ttlSecondsAfterFinished cleans up old revisions.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: localstack-init-r{{ .Release.Revision | default 1 }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ark.labels" . | nindent 4 }}
    app.kubernetes.io/component: localstack-init
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "ark.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: localstack-init
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-localstack
          image: curlimages/curl:latest
          env:
            - name: LOCALSTACK_URL
              value: {{ include "ark.s3Endpoint" . | quote }}
          command:
            - sh
            - -c
            - |
              until curl -sf "$LOCALSTACK_URL/_localstack/health" >/dev/null 2>&1; do
                echo "waiting for localstack..."
                sleep 2
              done
              echo "localstack healthy"
      containers:
        - name: init
          image: amazon/aws-cli:2
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.s3.region | default "us-east-1" | quote }}
            - name: AWS_ENDPOINT_URL
              value: {{ include "ark.s3Endpoint" . | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if aws s3api head-bucket --bucket {{ .Values.s3.bucket | quote }} 2>/dev/null; then
                echo "bucket {{ .Values.s3.bucket }} exists"
              else
                aws s3 mb s3://{{ .Values.s3.bucket }}
                echo "bucket {{ .Values.s3.bucket }} created"
              fi
{{- end }}

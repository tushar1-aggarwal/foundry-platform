{{- /*
Idempotent namespace registration. Always emitted -- temporal-worker fails
without its namespace.

post-install,post-upgrade hook (weight 5, after temporal-schema at 0). The
temporal CLI fails fast when the frontend isn't reachable yet (temporal-server
is still crashlooping toward its schema); the Job's backoffLimit is the
k8s-native retry until the server is serving. `namespace create` is guarded by
a `describe` check so re-runs on upgrade are no-ops.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-namespace
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ark.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-namespace
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/sync-wave": "5"
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 20
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "ark.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: temporal-namespace
    spec:
      restartPolicy: Never
      containers:
        - name: namespace
          image: "{{ .Values.temporal.namespaceJob.image.repository }}:{{ .Values.temporal.namespaceJob.image.tag }}"
          env:
            - name: TEMPORAL_ADDRESS
              value: "{{ .Values.temporal.serverServiceName }}:7233"
            - name: TEMPORAL_CLI_ADDRESS
              value: "{{ .Values.temporal.serverServiceName }}:7233"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Fail fast if the frontend isn't serving yet -- the Job
              # controller retries (backoffLimit) until temporal-server is up.
              temporal operator cluster health --address "$TEMPORAL_ADDRESS"
              {{- range .Values.temporal.namespaces }}
              if temporal operator namespace describe {{ . | quote }} >/dev/null 2>&1; then
                echo "namespace {{ . }} exists"
              else
                temporal operator namespace create --retention {{ $.Values.temporal.namespaceJob.retention }} {{ . | quote }}
                echo "namespace {{ . }} created"
              fi
              {{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ark.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-server
spec:
  replicas: {{ .Values.temporal.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "ark.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: temporal-server
  template:
    metadata:
      labels:
        {{- include "ark.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: temporal-server
    spec:
      initContainers:
        # Wait for the schema_version table to exist in both temporal databases
        # so the server doesn't crashloop during initial install. The schema
        # Job populates it; with external postgres the operator has done so
        # before install.
        - name: wait-for-schema
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: {{ include "ark.postgresqlHost" . | quote }}
            - name: PGPORT
              value: {{ include "ark.postgresqlPort" . | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.temporal.persistence.existingSecret }}
                  key: {{ .Values.temporal.persistence.secretKeys.username }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.temporal.persistence.existingSecret }}
                  key: {{ .Values.temporal.persistence.secretKeys.password }}
            - name: TEMPORAL_DB
              value: {{ .Values.temporal.persistence.database | quote }}
            - name: VISIBILITY_DB
              value: {{ .Values.temporal.persistence.visibilityDatabase | quote }}
          command:
            - sh
            - -c
            - |
              # schema_version is created by temporal-sql-tool setup-schema.
              until psql -d "$TEMPORAL_DB" -tAc "SELECT 1 FROM information_schema.tables WHERE table_name='schema_version'" 2>/dev/null | grep -q 1; do
                echo "waiting for temporal schema..."
                sleep 2
              done
              until psql -d "$VISIBILITY_DB" -tAc "SELECT 1 FROM information_schema.tables WHERE table_name='schema_version'" 2>/dev/null | grep -q 1; do
                echo "waiting for visibility schema..."
                sleep 2
              done
              echo "schemas ready"
      containers:
        - name: temporal-server
          image: "{{ .Values.temporal.server.image.repository }}:{{ .Values.temporal.server.image.tag }}"
          imagePullPolicy: {{ .Values.temporal.server.image.pullPolicy }}
          args:
            - --service=frontend
            - --service=history
            - --service=matching
            - --service=worker
          env:
            # Bind gRPC listener on all interfaces so the kubelet readiness probe
            # (which targets 127.0.0.1:7233) can reach the frontend. The
            # auto-setup default is to bind on TEMPORAL_ADDRESS (pod IP), which
            # breaks localhost probes. The pod still advertises its pod IP for
            # membership ring discovery via TEMPORAL_BROADCAST_ADDRESS below.
            - name: BIND_ON_IP
              value: "0.0.0.0"
            - name: DB
              value: postgres12
            - name: POSTGRES_SEEDS
              value: {{ include "ark.postgresqlHost" . | quote }}
            - name: DB_PORT
              value: {{ include "ark.postgresqlPort" . | quote }}
            - name: DBNAME
              value: {{ .Values.temporal.persistence.database | quote }}
            - name: VISIBILITY_DBNAME
              value: {{ .Values.temporal.persistence.visibilityDatabase | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.temporal.persistence.existingSecret }}
                  key: {{ .Values.temporal.persistence.secretKeys.username }}
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.temporal.persistence.existingSecret }}
                  key: {{ .Values.temporal.persistence.secretKeys.password }}
            {{- if .Values.temporal.server.tls.enabled }}
            - name: SQL_TLS_ENABLED
              value: "true"
            - name: SQL_TLS_DISABLE_HOST_VERIFICATION
              value: "true"
            {{- end }}
            # Multi-replica clusters need each pod to advertise its own IP for
            # membership ring discovery. 0.0.0.0 silently breaks ring formation
            # when replicaCount > 1 (prod default is 2).
            - name: TEMPORAL_BROADCAST_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: grpc
              containerPort: 7233
              protocol: TCP
          resources:
            {{- toYaml .Values.temporal.server.resources | nindent 12 }}
          # Probes use temporal CLI shipped with the server image's debian base.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "temporal operator cluster health --address 127.0.0.1:7233 >/dev/null 2>&1"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ark.fullname" . }}-control-plane
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ark.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ark.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        {{- include "ark.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "ark.serviceAccountName" . }}
      {{- end }}
      containers:
        - name: ark
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          # Hosted mode boots the web server in-process but does NOT spawn the
          # conductor (the daemon that serves :19100/health, which the kubelet
          # probes target). Spawn the daemon detached first, then exec the web
          # server so the daemon survives the parent replace and PID 1 is the
          # foreground process kubelet monitors.
          command:
            - sh
            - -c
            - >
              bun packages/cli/index.ts server daemon start
              --port {{ .Values.controlPlane.ports.conductor }}
              --detach
              && exec bun packages/cli/index.ts server start
              --hosted --port {{ .Values.controlPlane.ports.web }}
          ports:
            - name: web
              containerPort: {{ .Values.controlPlane.ports.web }}
              protocol: TCP
            - name: conductor
              containerPort: {{ .Values.controlPlane.ports.conductor }}
              protocol: TCP
            - name: router
              containerPort: {{ .Values.controlPlane.ports.router }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ark.fullname" . }}-config
          env:
            # In-cluster Kubernetes API CA trust. @kubernetes/client-node
            # picks up the in-cluster context fine, but Bun's TLS stack does
            # not auto-load the service-account CA the way kubectl does --
            # without this, K8sCompute.provision (and any other in-cluster
            # K8s API call) fails with "unable to verify the first
            # certificate". The file is mounted automatically when a service
            # account is attached to the pod.
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            {{- if and (not .Values.postgresql.enabled) .Values.postgresql.external.host }}
            # External Postgres -- DB_USERNAME/DB_PASSWORD from the
            # RDS-managed secret (rotating). DATABASE_URL is built at
            # startup by the wrapper command above (URL-encodes special
            # chars in the password).
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.external.existingSecret }}
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.external.existingSecret }}
                  key: DB_PASSWORD
            - name: DB_HOST
              value: {{ .Values.postgresql.external.host | quote }}
            - name: DB_PORT
              value: {{ .Values.postgresql.external.port | quote }}
            - name: DB_NAME
              value: {{ .Values.postgresql.external.database | quote }}
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ark.dbSecretName" . }}
                  key: DATABASE_URL
            {{- end }}
            - name: ARK_TENSORZERO_URL
              value: "http://localhost:3000"
            - name: ARK_TENSORZERO_ENABLED
              value: "1"
            # Conductor daemon defaults to 127.0.0.1; kubelet probes target the
            # pod IP, so we have to bind on all interfaces. Same shape as the
            # temporal-server BIND_ON_IP fix in temporal-server-deployment.yaml.
            - name: ARK_CONDUCTOR_HOSTNAME
              value: "0.0.0.0"
            {{- if .Values.s3.bucket }}
            # Hosted mode requires storage.blobBackend=s3 (LocalDiskBlobStore
            # is pod-ephemeral and rejected at boot in di/storage.ts). Plumbed
            # from .Values.s3 so chart consumers don't have to duplicate it.
            # ARK_S3_ENDPOINT / AWS_ENDPOINT_URL_S3 / ARK_S3_PATH_STYLE come
            # from the configmap when LocalStack is wired.
            - name: ARK_BLOB_BACKEND
              value: "s3"
            - name: ARK_S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: ARK_S3_REGION
              value: {{ .Values.s3.region | quote }}
            {{- if .Values.s3.prefix }}
            - name: ARK_S3_PREFIX
              value: {{ .Values.s3.prefix | quote }}
            {{- end }}
            # LocalStack accepts any credentials; supply dummy values so the
            # AWS SDK chain doesn't fall through to IMDS lookups inside the
            # pod (which would hang then 404).
            {{- if include "ark.s3Endpoint" . }}
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
            {{- end }}
            {{- end }}
          {{- if or .Values.llm.anthropicApiKey .Values.llm.existingSecret }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ark.llmSecretName" . }}
                  key: ANTHROPIC_API_KEY
                  optional: true
          {{- end }}
          {{- if or .Values.llm.openaiApiKey .Values.llm.existingSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ark.llmSecretName" . }}
                  key: OPENAI_API_KEY
                  optional: true
          {{- end }}
          {{- if or .Values.llm.googleApiKey .Values.llm.existingSecret }}
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ark.llmSecretName" . }}
                  key: GOOGLE_API_KEY
                  optional: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: conductor
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: conductor
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: conductor
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          volumeMounts:
            - name: ark-data
              mountPath: /root/.ark
        {{- if .Values.tensorZero.enabled }}
        - name: tensorzero
          image: "{{ .Values.tensorZero.image.repository | default "tensorzero/gateway" }}:{{ .Values.tensorZero.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.tensorZero.image.pullPolicy | default "IfNotPresent" }}
          args:
            - --config-file
            - /app/config/tensorzero.toml
          ports:
            - name: tensorzero
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: tensorzero-config
              mountPath: /app/config
          env:
          {{- if or .Values.llm.anthropicApiKey .Values.llm.existingSecret }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ark.llmSecretName" . }}
                  key: ANTHROPIC_API_KEY
                  optional: true
          {{- end }}
          {{- if or .Values.llm.openaiApiKey .Values.llm.existingSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ark.llmSecretName" . }}
                  key: OPENAI_API_KEY
                  optional: true
          {{- end }}
          {{- if or .Values.llm.googleApiKey .Values.llm.existingSecret }}
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ark.llmSecretName" . }}
                  key: GOOGLE_API_KEY
                  optional: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /status
              port: tensorzero
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml (.Values.tensorZero.resources | default (dict "requests" (dict "cpu" "100m" "memory" "128Mi") "limits" (dict "cpu" "500m" "memory" "256Mi"))) | nindent 12 }}
        {{- end }}
      volumes:
        - name: ark-data
          emptyDir: {}
        - name: tensorzero-config
          configMap:
            name: {{ include "ark.fullname" . }}-tensorzero-config
            optional: true

# -- Global
namespace: ark
replicaCount: 1

# -- Ark Control Plane
controlPlane:
  image:
    repository: ark
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  ports:
    web: 8420
    conductor: 19100
    router: 8430
  auth:
    enabled: true
  router:
    enabled: true
    policy: balanced
  # The S3SnapshotStore for hosted mode is still TODO upstream; FsSnapshotStore
  # is pod-ephemeral and rejected at boot in di/storage.ts. This flag bypasses
  # the check. Safe ONLY at replicaCount=1 (single-pod snapshots don't need
  # cross-pod visibility). Flip false the day the S3 snapshot store impl lands.
  # Independent of localstack/S3 -- the bypass is about the snapshot store
  # type, not whether S3 is reachable.
  devAllowLocalHostedStorage: false

# -- Workers
workers:
  enabled: true
  replicaCount: 3
  image:
    repository: ark
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 4Gi
  capacity: 5              # max sessions per worker
  # Kata/Firecracker runtime for hardware isolation
  kata:
    enabled: false
    runtimeClassName: kata-fc

# -- PostgreSQL
# Shared by the control plane (ark database) AND Temporal (temporal +
# temporal_visibility databases, temporal role). One server, multiple databases.
postgresql:
  enabled: true            # set false to use external
  image: postgres:16-alpine
  storage: 10Gi
  auth:
    username: ark
    password: ark           # override in production!
    database: ark
  # External Postgres (when postgresql.enabled=false)
  external:
    host: ""
    port: 5432
    database: ark
    existingSecret: ""      # K8s secret with DATABASE_URL + DB_USERNAME/DB_PASSWORD

# -- Redis
redis:
  enabled: true             # set false to use external
  image: redis:7-alpine
  # External Redis (when redis.enabled=false)
  external:
    host: ""
    port: 6379
    existingSecret: ""

# -- LocalStack (S3 emulator for dev / local k8s)
# When enabled, deploys LocalStack in-cluster and points the control plane and
# Temporal worker at it via ARK_S3_ENDPOINT. When disabled, falls back to
# `localstack.external.endpoint`; if that is empty too, the control plane uses
# real AWS S3 (default SDK behavior).
localstack:
  enabled: false
  image: localstack/localstack:3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  external:
    endpoint: ""            # e.g. http://localstack.corp:4566

# -- S3 backend for ark blob storage (hosted mode). When `bucket` is set,
# control-plane and temporal-worker get ARK_BLOB_BACKEND=s3 + ARK_S3_BUCKET/
# REGION/PREFIX env vars. When the resolved S3 endpoint is non-empty (via
# localstack.enabled or localstack.external.endpoint), the chart also wires
# ARK_S3_ENDPOINT + AWS_ENDPOINT_URL_S3 + ARK_S3_PATH_STYLE=true.
s3:
  bucket: ""
  region: ""
  prefix: ""

# -- Ingress
ingress:
  enabled: true
  className: nginx
  host: ark.example.com
  tls:
    enabled: false
    secretName: ark-tls
  annotations: {}

# -- LLM Provider Keys (create a K8s secret)
llm:
  anthropicApiKey: ""
  openaiApiKey: ""
  googleApiKey: ""
  existingSecret: ""        # K8s secret with API keys

# -- Service Account
serviceAccount:
  create: true
  name: ark
  annotations: {}

# -- ExternalSecret (off by default; enable in env values to pull from AWS SM)
externalSecret:
  enabled: false

# -- TensorZero sidecar (off by default)
tensorZero:
  enabled: false

# -- Temporal (workflow orchestration; always deployed -- Phase 3 dispatch
# is workflow-driven). Persistence runs on the same Postgres server as the
# control plane (resolved via ark.postgresqlHost/ark.postgresqlPort), with
# its own role + dedicated databases.
temporal:
  # Default namespace passed to Ark control plane / worker.
  namespace: ark
  # All namespaces created by the post-install Job. The default namespace
  # MUST appear in this list.
  namespaces:
    - ark
  # Single task queue name used when taskQueueAssignments is empty.
  taskQueue: ark.default.stages
  # Comma-separated task queues for sharded workers. Empty means use taskQueue.
  taskQueueAssignments: ""
  # In-cluster Service name for the Temporal frontend.
  serverServiceName: temporal-server

  server:
    replicaCount: 1
    image:
      repository: temporalio/server
      tag: "1.27"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    tls:
      enabled: true             # external/RDS Postgres typically requires SSL; flip false for in-cluster Postgres or local clusters

  # Persistence -- shared with the control-plane Postgres (host/port resolved
  # from postgresql.* via ark.postgresqlHost/Port). Temporal still owns its
  # own role + databases.
  persistence:
    database: temporal
    visibilityDatabase: temporal_visibility
    existingSecret: temporal-db-credentials
    secretKeys:
      username: POSTGRES_USER
      password: POSTGRES_PWD

  # Bootstrap Job: creates the `temporal` role + temporal/temporal_visibility
  # databases. Runs only when postgresql.enabled (chart-owned database). When
  # postgresql.enabled=false the operator is responsible for provisioning
  # these out-of-band against their external Postgres.
  dbBootstrap:
    masterSecretName: ""
    masterSecretKeys:
      username: DB_USERNAME
      password: DB_PASSWORD
    image:
      repository: postgres
      tag: "16-alpine"

  # Helm Job: temporal-sql-tool setup-schema + update-schema.
  # Runs on pre-install AND pre-upgrade. Idempotent.
  schemaJob:
    image:
      repository: temporalio/admin-tools
      tag: "1.27"
    # 3 retries to absorb transient RDS connection drops mid-migration. Job
    # is idempotent (setup is gated on schema_version absence, update-schema
    # is a no-op when current), so retries are safe.
    backoffLimit: 3

  # Helm Job: post-install, creates namespaces idempotently.
  namespaceJob:
    image:
      repository: temporalio/admin-tools
      tag: "1.27"
    retention: 72h

  ui:
    enabled: true
    image:
      repository: temporalio/ui
      tag: "2.34.0"
    corsOrigins: ""
    ingress:
      enabled: false
      path: /temporal
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # The Ark-side Temporal worker (Node+tsx process).
  worker:
    replicaCount: 2
    image:
      repository: ghcr.io/ytarasova/ark-temporal-worker
      tag: latest
      pullPolicy: Always
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

# Production values for Ark Helm chart
#
# Usage:
#   helm install ark .infra/helm/ark/ -f .infra/helm/ark/values-production.yaml

namespace: ark

controlPlane:
  image:
    repository: ark
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 4Gi

workers:
  replicaCount: 10
  kata:
    enabled: true
    runtimeClassName: kata-fc
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 8Gi
  capacity: 5

# Use external managed Postgres (e.g. RDS).
# Temporal shares the same Postgres server -- one host, one credential set.
# The temporal role + temporal/temporal_visibility databases must be
# provisioned out-of-band against this Postgres (the chart's bootstrap job
# only runs when postgresql.enabled).
postgresql:
  enabled: false
  external:
    host: your-rds-endpoint.amazonaws.com
    port: 5432
    database: ark
    existingSecret: ark-db-credentials

# Use external managed Redis (e.g. ElastiCache)
redis:
  enabled: false
  external:
    host: your-elasticache.amazonaws.com
    port: 6379
    existingSecret: ark-redis-credentials

# LocalStack is dev-only -- always disabled in production. With both flags
# off and localstack.external.endpoint empty, the chart wires nothing for
# ARK_S3_ENDPOINT and the AWS SDK uses real S3.
localstack:
  enabled: false

ingress:
  enabled: true
  className: nginx
  host: ark.yourcompany.com
  tls:
    enabled: true
    secretName: ark-tls

llm:
  existingSecret: ark-llm-keys

# -- Temporal (production overrides)
# Persistence (host/port) is resolved from postgresql.external above -- no
# separate temporal.persistence.host field exists anymore. The temporal role
# and databases must be provisioned in the external Postgres before install.
temporal:
  server:
    replicaCount: 2
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 4000m
        memory: 8Gi
    tls:
      enabled: true   # RDS requires SSL
  ui:
    enabled: true
    # The UI is exposed in-cluster on Service temporal-ui:8080. Path-based
    # ingress routing at /temporal needs either a TEMPORAL_UI_PUBLIC_PATH env
    # var on the UI container or an nginx rewrite-target annotation; neither
    # is wired yet. Until then, access the UI via:
    #   kubectl -n ark port-forward svc/temporal-ui 8088:8080
    # or expose it on a dedicated subdomain (separate ingress).
    ingress:
      enabled: false
      path: /temporal
  worker:
    replicaCount: 3
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi

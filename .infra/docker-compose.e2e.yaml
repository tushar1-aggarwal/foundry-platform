# Isolated Postgres + Redis for the control-plane e2e test suite.
#
# Distinct from .infra/docker-compose.dev.yaml so a developer running
# `make dev-stack` locally can also run `make test-e2e-control-plane`
# without either stack touching the other's data, ports, or volumes.
#
# Brings up:
#   - ark-e2e-postgres         : Postgres 16 on :15434 (vs dev :15433)
#   - ark-e2e-redis            : Redis 7    on :6380  (vs dev :6379)
#   - ark-e2e-temporal-postgres: Postgres 16 on :15435 (Temporal persistence)
#   - ark-e2e-temporal         : Temporal server on :7234 (vs dev :7233)
#   - ark-e2e-temporal-ui      : Temporal UI on :8089 (vs dev :8088)
#   - ark-e2e-temporal-worker  : Ark worker (replicas: 2) for T1-T5
#
# Volumes: ark-e2e-* (vs dev's ark-dev-*). Wiped on every
# `make test-e2e-temporal-down` run via `down -v`.
#
# Usage (via Makefile):
#   make test-e2e-temporal             # full lifecycle (T1-T5)
#   make test-e2e-temporal-up          # just bring up (debug)
#   make test-e2e-temporal-down        # just tear down (debug)
#   make test-e2e-control-plane        # bespoke-only (no Temporal services needed)
#   make test-e2e-control-plane-up     # just bring up (debug)
#   make test-e2e-control-plane-down   # just tear down (debug)

name: ark-e2e

services:
  postgres:
    image: postgres:16
    container_name: ark-e2e-postgres
    restart: "no"
    environment:
      POSTGRES_USER: ark
      POSTGRES_PASSWORD: ark
      POSTGRES_DB: ark
    ports:
      - "15434:5432"
    volumes:
      - ark-e2e-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ark -d ark"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: ark-e2e-redis
    restart: "no"
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6380:6379"
    volumes:
      - ark-e2e-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal-postgres:
    image: postgres:16
    container_name: ark-e2e-temporal-postgres
    restart: "no"
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "15435:5432"
    volumes:
      - ark-e2e-temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.27
    container_name: ark-e2e-temporal
    restart: "no"
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "7234:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal workflow list --namespace default --address $$(hostname -i):7233"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: ark-e2e-temporal-ui
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8089:8080"

  temporal-worker:
    build:
      context: ..
      dockerfile: .infra/Dockerfile.temporal-worker
    image: ark-temporal-worker:e2e
    restart: on-failure
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Linux CI runners do not auto-resolve `host.docker.internal` (it is
    # only wired up on Docker Desktop for Mac/Windows). The
    # `host-gateway` magic value asks the daemon to point the alias at
    # the docker0 bridge IP, which is what reaches the test process'
    # ark server. Without this, stub-runner agents inside the worker
    # cannot deliver completion reports and every T1-T5 test that
    # awaits a session-status transition hangs to its timeout.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://ark:ark@postgres:5432/ark?sslmode=disable
      ARK_TEMPORAL_SERVER_URL: temporal:7233
      ARK_TEMPORAL_NAMESPACE: default
      ARK_TEMPORAL_WORKER: "true"
      ARK_TEMPORAL_ORCHESTRATION: "true"
      ARK_PROFILE: control-plane
      ARK_LOG_LEVEL: warn
      ARK_BLOB_BACKEND: local
      ARK_DEV_ALLOW_LOCAL_HOSTED_STORAGE: "1"
      ARK_SECRETS_BACKEND: file
      ARK_AUTH_REQUIRE_TOKEN: "false"
      ARK_DEFAULT_TENANT: default
      # Opt-in switch for the e2e test stubs in scripts/temporal-worker-entrypoint.sh.
      # When set, the entrypoint installs fake-claude-code-executor.mjs as a
      # plugin under <arkDir>/plugins/executors/claude-code.mjs, which shadows
      # the real claude-code built-in via the registerExecutor() last-write-wins
      # registry. Prod deploys must leave this unset so the real executor wins.
      ARK_E2E_MODE: "1"
      # Enable test-only action handlers (notably `flaky_pr`) so T5a/T5b can
      # exercise retry policy + non-retryable failures through this worker.
      # Without this, executeAction sees flaky_pr as an unknown action and
      # returns ok:true ("skipped"), letting the workflow mark the session
      # completed -- which is what made T5b silently fail on CI while
      # passing locally (the host-side worker target wires this in).
      ARK_ENABLE_TEST_ACTIONS: "1"
      # The stub-runner executor spawns child processes that report stage
      # completion via JSON-RPC channel/deliver to the conductor. In hosted
      # mode the conductor is merged into the web server, so the agent
      # callback URL is the web port (ARK_WEB_PORT in .env.e2e = 8422).
      # host.docker.internal reaches the test process on the docker host
      # (Mac/Windows), and via the gateway on Linux.
      ARK_CONDUCTOR_URL: "http://host.docker.internal:8422"
      # Required by claude-code runtime's secret declaration -- fake-claude
      # doesn't read it but dispatch validation rejects launch if missing.
      # File-backed secrets aren't shared with the host server, so set it
      # directly here for the worker's tenant=default secret resolver.
      CLAUDE_CODE_OAUTH_TOKEN: "e2e-test-dummy-oauth-token"
    volumes:
      # Fake claude binary for e2e tests -- replaces the real claude so agents
      # complete stages without an Anthropic API key or real LLM calls.
      - ../e2e/fixtures/fake-claude.sh:/usr/local/bin/claude:ro
      # e2e/ is now excluded from prod builds via .dockerignore (defense in
      # depth: prevents the fake-claude-code stub from shadowing the real
      # claude-code executor in prod even if ARK_E2E_MODE leaks). The
      # temporal-worker entrypoint reads fixtures from /app/e2e/fixtures, so
      # bind-mount them here at the same path for the e2e stack.
      - ../e2e/fixtures:/app/e2e/fixtures:ro
    # Process-alive healthcheck so `docker compose up --wait` blocks until
    # the worker entrypoint has actually exec'd tsx and the worker.ts process
    # is up. Without this, `--wait` returned immediately and the first test
    # raced the worker's Temporal-connect + task-queue-poll registration --
    # session/start fired, the workflow queued on `ark.default.stages`, and
    # the activity never ran because no poller was registered yet. The
    # follow-up `waitForTemporalWorkerPolling()` in docker-stack.ts confirms
    # the worker is *actually* polling (not just process-alive).
    #
    # Uses /proc directly instead of `pgrep -f` because older cached worker
    # images may not yet have `procps` installed (Dockerfile adds it but a
    # stale cached layer can lag). /proc is always present on Linux.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "for f in /proc/[0-9]*/cmdline; do tr '\\0' ' ' < $$f 2>/dev/null | grep -q 'packages/core/temporal/worker.ts' && exit 0; done; exit 1"
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    # Note (T6 worker-in-container): an earlier iteration mounted the host's
    # docker.sock + arkDir + source tree here so this worker could dispatch
    # T6 sidecars from inside compose. Reverted because we can't currently
    # rebuild this image with the docker CLI installed -- Zscaler intercepts
    # the binary fetches. T6's runnable path spawns the temporal worker on
    # the HOST (see Makefile `test-e2e-t6-docker`). When the Zscaler CA is
    # trusted by Docker Desktop, re-add the mounts + ARK_DOCKER_AGENT_NETWORK
    # env to flip back to worker-in-compose.

volumes:
  ark-e2e-postgres-data:
    name: ark-e2e-postgres-data
  ark-e2e-redis-data:
    name: ark-e2e-redis-data
  ark-e2e-temporal-postgres-data:
    name: ark-e2e-temporal-postgres-data
